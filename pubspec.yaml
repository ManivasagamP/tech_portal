name: technician_portal
description: "Fusion Eco Technician Portal — field maintenance app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # network
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.1.0

  # storage
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ui
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.0

  # device capture — checklist sessions record a face photo and coordinates,
  # and notes can be spoken instead of typed
  image_picker: ^1.1.2
  record: ^7.1.1
  just_audio: ^0.9.42
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  permission_handler: ^11.3.1

  # utils
  uuid: ^4.5.1
  intl: ^0.20.1
  collection: ^1.19.0
  fl_chart: ^1.2.0
  mobile_scanner: ^7.4.0
  vibration: ^3.2.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
